<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Диагностика: гироскоп Z vs дыхание</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:system-ui,sans-serif; }
    canvas { display:block; width:100vw; height:100vh; }
    #ui { position:absolute; bottom:20px; left:0; width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; color:white; z-index:10; pointer-events:none; }
    .stability-bar { width:80%; max-width:300px; height:8px; background:rgba(255,255,255,0.2); border-radius:4px; overflow:hidden; margin-top:5px; }
    .stability-fill { height:100%; width:0%; background:linear-gradient(90deg,#ff4d4d,#ffdd57,#4caf50); border-radius:4px; transition:width 0.2s ease; }
    #stability-text { font-size:16px; letter-spacing:2px; color:rgba(255,255,255,0.8); }
    button { pointer-events:auto; padding:10px 20px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:white; border-radius:30px; font-size:14px; backdrop-filter:blur(10px); cursor:pointer; margin:0 5px; }
    button:hover { background:rgba(255,255,255,0.25); }
    #controls { display:flex; gap:10px; margin-top:5px; }
    .info { font-size:12px; color:rgba(255,255,255,0.5); max-width:80%; text-align:center; }
    #debug { position:absolute; top:10px; left:10px; color:rgba(255,255,255,0.6); font-size:12px; z-index:10; pointer-events:none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="debug">Gyro Z (сырой): 0.000 | Период: --с | Стаб: 0%</div>
  <div id="ui">
    <div id="stability-text">СТАБИЛЬНОСТЬ 0%</div>
    <div class="stability-bar"><div id="stability-fill" class="stability-fill"></div></div>
    <div id="controls">
      <button id="start-btn">СТАРТ</button>
      <button id="gain-down">Gain −</button>
      <button id="gain-up">Gain +</button>
    </div>
    <div class="info">Если СИНИЙ график плоский — гироскоп Z не даёт дыхания. Попробуйте другой датчик или ось.</div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      const startBtn = document.getElementById('start-btn');
      const stabilityText = document.getElementById('stability-text');
      const stabilityFill = document.getElementById('stability-fill');
      const debugEl = document.getElementById('debug');
      const gainUpBtn = document.getElementById('gain-up');
      const gainDownBtn = document.getElementById('gain-down');

      // Кольца
      const RINGS = [
        { count:28, rMin:55, rMax:110, dMin:6, dMax:10, rot:0.20 },
        { count:32, rMin:85, rMax:165, dMin:7, dMax:10, rot:0.10 },
        { count:36, rMin:115, rMax:220, dMin:6, dMax:11, rot:0.05 },
        { count:40, rMin:145, rMax:285, dMin:6, dMax:14, rot:0.025 }
      ];
      let points = [], chaosOffsets = [];

      let targetStability = 0, currentStability = 0;
      let breathPhase = 0, simTime = 0, lastFrameTs = 0;

      // Буферы графиков (сырой и фильтрованный)
      const HIST = 400;
      let rawGraph = new Float32Array(HIST);
      let filteredGraph = new Float32Array(HIST);
      let graphIdx = 0, graphFull = false;

      let sensorActive = false;
      let signalGain = 20.0; // начнём с большого усиления для гироскопа
      let rawGyroZ = 0;

      // Фильтр дыхания (полосовой 0.08–0.5 Гц)
      class BiquadBandpass {
        constructor() {
          this.x1 = this.x2 = this.y1 = this.y2 = 0;
          this.updateCoeffs(50, 0.25, 1.5);
        }
        updateCoeffs(fs, f0, Q) {
          const w0 = 2 * Math.PI * f0 / fs;
          const alpha = Math.sin(w0) / (2 * Q);
          const cosw0 = Math.cos(w0);
          this.b0 = alpha; this.b1 = 0; this.b2 = -alpha;
          this.a0 = 1 + alpha; this.a1 = -2 * cosw0; this.a2 = 1 - alpha;
          this.b0 /= this.a0; this.b1 /= this.a0; this.b2 /= this.a0;
          this.a1 /= this.a0; this.a2 /= this.a0;
        }
        process(x) {
          const y = this.b0 * x + this.b1 * this.x1 + this.b2 * this.x2
                  - this.a1 * this.y1 - this.a2 * this.y2;
          this.x2 = this.x1; this.x1 = x;
          this.y2 = this.y1; this.y1 = y;
          return y;
        }
        reset() { this.x1 = this.x2 = this.y1 = this.y2 = 0; }
      }
      const bandpass = new BiquadBandpass();

      // Детектор пересечений нуля
      let zeroCrossUpTimes = [];
      let lastZeroCrossTime = 0;
      let prevSign = 0;
      const MIN_PERIOD = 1000;
      const MAX_PERIOD = 10000;
      const MAX_CROSSES = 8;
      let currentPeriodMs = 4000;
      let prevTime = 0;

      gainUpBtn.addEventListener('click', () => { signalGain = Math.min(100.0, signalGain + 5.0); });
      gainDownBtn.addEventListener('click', () => { signalGain = Math.max(1.0, signalGain - 5.0); });

      function initPoints() {
        points = []; chaosOffsets = [];
        const w = window.innerWidth, h = window.innerHeight;
        for (let r = 0; r < RINGS.length; r++) {
          const ring = RINGS[r];
          for (let i = 0; i < ring.count; i++) {
            chaosOffsets.push({
              bx: Math.random() * w, by: Math.random() * h,
              dx: (Math.random() - 0.5) * 0.5, dy: (Math.random() - 0.5) * 0.5,
              ph: Math.random() * Math.PI * 2
            });
            points.push({
              ring: r, idx: i,
              ang: (2 * Math.PI * i) / ring.count,
              rMin: ring.rMin, rMax: ring.rMax,
              dMin: ring.dMin, dMax: ring.dMax,
              jit: 0.6 + Math.random() * 1.2
            });
          }
        }
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth, h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (chaosOffsets.length) {
          for (let i = 0; i < chaosOffsets.length; i++) {
            chaosOffsets[i].bx = Math.random() * w;
            chaosOffsets[i].by = Math.random() * h;
          }
        }
      }
      window.addEventListener('resize', resize);

      function processMotion(gz, ts) {
        if (!isFinite(gz)) return;
        rawGyroZ = gz;

        const amplified = gz * signalGain;

        // Динамическая частота дискретизации
        if (prevTime !== 0) {
          const dtMs = Math.max(1, ts - prevTime);
          const fs = 1000 / dtMs;
          if (fs > 10 && fs < 200) {
            bandpass.updateCoeffs(fs, 0.25, 1.5);
          }
        }
        prevTime = ts;

        const filtered = bandpass.process(amplified);

        // Сохраняем оба сигнала для отрисовки
        rawGraph[graphIdx % HIST] = amplified * 10; // усилим для видимости
        filteredGraph[graphIdx % HIST] = filtered;
        graphIdx++;
        if (graphIdx >= HIST && !graphFull) graphFull = true;

        // Детектор нуля для стабильности
        const nowSign = filtered > 0.02 ? 1 : (filtered < -0.02 ? -1 : prevSign);
        if (nowSign === 1 && prevSign === -1) {
          const nowTs = ts;
          if (lastZeroCrossTime !== 0) {
            const period = nowTs - lastZeroCrossTime;
            if (period >= MIN_PERIOD && period <= MAX_PERIOD) {
              zeroCrossUpTimes.push(period);
              if (zeroCrossUpTimes.length > MAX_CROSSES) zeroCrossUpTimes.shift();
            }
          }
          lastZeroCrossTime = nowTs;
        }
        prevSign = nowSign;

        if (zeroCrossUpTimes.length >= 2) {
          const avg = zeroCrossUpTimes.reduce((a, b) => a + b, 0) / zeroCrossUpTimes.length;
          currentPeriodMs += (avg - currentPeriodMs) * 0.2;
        }
      }

      function onDeviceMotion(e) {
        const r = e.rotationRate;
        if (!r) return;
        processMotion(r.z ?? 0, performance.now());
      }

      function computeStability() {
        if (zeroCrossUpTimes.length < 3) return 0;
        const mean = zeroCrossUpTimes.reduce((a, b) => a + b, 0) / zeroCrossUpTimes.length;
        const variance = zeroCrossUpTimes.reduce((s, v) => s + (v - mean) ** 2, 0) / zeroCrossUpTimes.length;
        const cv = Math.sqrt(variance) / mean;
        return Math.max(0, 1 - cv / 0.15);
      }

      async function startSensors() {
        if (sensorActive) return;
        if (typeof DeviceMotionEvent === 'undefined') { alert('Датчики не поддерживаются'); return; }
        try {
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const p = await DeviceMotionEvent.requestPermission();
            if (p !== 'granted') { alert('Разрешение отклонено'); return; }
          }
          window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
          sensorActive = true;
          startBtn.textContent = 'ПАУЗА';
        } catch (e) { alert('Ошибка'); }
      }

      function stopSensors() {
        if (!sensorActive) return;
        window.removeEventListener('devicemotion', onDeviceMotion);
        sensorActive = false;
        startBtn.textContent = 'СТАРТ';
        bandpass.reset();
        zeroCrossUpTimes = [];
        lastZeroCrossTime = 0;
        prevSign = 0;
        currentPeriodMs = 4000;
        graphIdx = 0; graphFull = false;
        rawGraph.fill(0); filteredGraph.fill(0);
        prevTime = 0;
        targetStability = 0;
      }

      startBtn.addEventListener('click', () => sensorActive ? stopSensors() : startSensors());

      function draw(ts) {
        if (!lastFrameTs) lastFrameTs = ts;
        const dt = Math.min(50, ts - lastFrameTs);
        lastFrameTs = ts;
        simTime += dt;

        const w = window.innerWidth, h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        const rawStab = computeStability();
        targetStability = rawStab;
        const alphaSmooth = 1 - Math.exp(-dt / 600);
        currentStability += (targetStability - currentStability) * alphaSmooth;
        const stabPercent = Math.round(currentStability * 100);
        stabilityText.textContent = `СТАБИЛЬНОСТЬ ${stabPercent}%`;
        stabilityFill.style.width = `${stabPercent}%`;

        const periodAnim = currentPeriodMs || 4000;
        breathPhase += (2 * Math.PI) * (dt / periodAnim);
        breathPhase %= (2 * Math.PI);
        const breath = (Math.sin(breathPhase) + 1) / 2;
        const eased = smoothstep(breath);
        const rotFactor = currentStability;

        const cx = w * 0.5, cy = h * 0.38;
        const aspectRatio = w / h;

        // Точки колец
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const ring = RINGS[p.ring];
          const ch = chaosOffsets[i];
          const angle = p.ang + simTime * 0.00015 * ring.rot * rotFactor;
          const radius = p.rMin + (p.rMax - p.rMin) * eased;
          const ix = cx + Math.cos(angle) * radius;
          const iy = cy + Math.sin(angle) * radius * aspectRatio;
          const dx = Math.sin(simTime * 0.0005 + ch.ph) * 20 * ch.dx;
          const dy = Math.cos(simTime * 0.0007 + ch.ph) * 20 * ch.dy;
          const chX = clamp(ch.bx + dx, 0, w);
          const chY = clamp(ch.by + dy, 0, h);
          const x = chX + (ix - chX) * currentStability;
          const y = chY + (iy - chY) * currentStability;
          const idealSize = p.dMin + (p.dMax - p.dMin) * eased;
          const size = p.jit + (idealSize - p.jit) * currentStability;
          const alpha = 0.3 + 0.7 * currentStability;
          const glow = size * 2 * currentStability;

          ctx.beginPath();
          ctx.arc(x, y, size, 0, 2 * Math.PI);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.shadowColor = `rgba(255, 255, 255, ${alpha * 0.5})`;
          ctx.shadowBlur = glow;
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // ---- ДВА ГРАФИКА ----
        const gy1 = h * 0.7;
        const gy2 = h * 0.82;
        const gh = 50;
        const gx = 20, gw = w - 40;

        // Фон
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(gx - 5, gy1 - gh/2 - 5, gw + 10, gh + 10);
        ctx.fillRect(gx - 5, gy2 - gh/2 - 5, gw + 10, gh + 10);

        // Подписи
        ctx.font = '10px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillText('Сырой гироскоп Z (x Gain)', gx, gy1 - gh/2 - 8);
        ctx.fillText('Фильтрованное дыхание', gx, gy2 - gh/2 - 8);

        const cnt = graphFull ? HIST : graphIdx;
        if (cnt > 1) {
          // Сырой сигнал (красный)
          ctx.strokeStyle = 'rgba(255, 100, 100, 0.9)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          const start = graphFull ? graphIdx : 0;
          const step = Math.max(1, Math.floor(cnt / gw));
          for (let i = 0; i < cnt - 1; i += step) {
            const i1 = (start + i) % HIST;
            const i2 = (start + i + step) % HIST;
            const v1 = rawGraph[i1], v2 = rawGraph[i2];
            const x1 = gx + (i / (cnt - 1)) * gw;
            const x2 = gx + ((i + step) / (cnt - 1)) * gw;
            ctx.moveTo(x1, gy1 - v1);
            ctx.lineTo(x2, gy1 - v2);
          }
          ctx.stroke();

          // Фильтрованный (зелёный)
          ctx.strokeStyle = 'rgba(100, 255, 100, 0.9)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < cnt - 1; i += step) {
            const i1 = (start + i) % HIST;
            const i2 = (start + i + step) % HIST;
            const v1 = filteredGraph[i1], v2 = filteredGraph[i2];
            const x1 = gx + (i / (cnt - 1)) * gw;
            const x2 = gx + ((i + step) / (cnt - 1)) * gw;
            ctx.moveTo(x1, gy2 - v1 * 15);
            ctx.lineTo(x2, gy2 - v2 * 15);
          }
          ctx.stroke();
        }

        // Отладка
        const periodSec = currentPeriodMs ? (currentPeriodMs / 1000).toFixed(1) : '--';
        debugEl.textContent = `Gyro Z (сырой): ${rawGyroZ.toFixed(3)} | Период: ${periodSec}с | Стаб: ${stabPercent}%`;

        requestAnimationFrame(draw);
      }

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function smoothstep(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

      function init() {
        resize();
        initPoints();
        startBtn.textContent = 'СТАРТ';
        requestAnimationFrame(draw);
      }
      init();
    })();
  </script>
</body>
</html>
