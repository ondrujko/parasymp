<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Когерентное дыхание — IMU Biofeedback</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: white; z-index: 10; pointer-events: none;
    }
    .coherence-bar {
      width: 80%; max-width: 300px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px;
      overflow: hidden; margin-top: 5px;
    }
    .coherence-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ff4d4d, #ffdd57, #4caf50);
      border-radius: 4px; transition: width 0.2s ease;
    }
    #coherence-text {
      font-size: 16px; letter-spacing: 2px; color: rgba(255,255,255,0.8);
    }
    button {
      pointer-events: auto; padding: 12px 24px; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 30px;
      font-size: 16px; backdrop-filter: blur(10px); cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.25); }
    button:active { background: rgba(255,255,255,0.4); }
    .info {
      font-size: 12px; color: rgba(255,255,255,0.5); max-width: 80%; text-align: center;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="coherence-text">КОГЕРЕНТНОСТЬ 0%</div>
    <div class="coherence-bar"><div id="coherence-fill" class="coherence-fill"></div></div>
    <button id="start-btn">СТАРТ</button>
    <div class="info">Положите телефон на грудь (экран вверх) и дышите медленно (5-6 вдохов/мин)</div>
  </div>

  <script>
    (function() {
      // -------------------- DOM элементы --------------------
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const startBtn = document.getElementById('start-btn');
      const coherenceText = document.getElementById('coherence-text');
      const coherenceFill = document.getElementById('coherence-fill');

      // -------------------- Параметры визуализации --------------------
      const RINGS = [
        { count: 28, radiusMin: 55, radiusMax: 110, dotMin: 6, dotMax: 10, rotSpeed: 0.20 },
        { count: 32, radiusMin: 85, radiusMax: 165, dotMin: 7, dotMax: 10, rotSpeed: 0.10 },
        { count: 36, radiusMin: 115, radiusMax: 220, dotMin: 6, dotMax: 11, rotSpeed: 0.05 },
        { count: 40, radiusMin: 145, radiusMax: 285, dotMin: 6, dotMax: 14, rotSpeed: 0.025 }
      ];

      let points = [];            // массив точек с их начальными параметрами
      let chaosOffsets = [];     // предварительно вычисленные случайные смещения для хаоса (стабильный шум)

      // -------------------- Состояние анимации --------------------
      let targetCoherence = 0;   // целевое значение когерентности из анализа (0..1)
      let currentCoherence = 0;  // сглаженное значение для плавной анимации
      let breathPhase = 0;       // фаза дыхания для анимации (0..2PI)
      let time = 0;              // общее время анимации

      // -------------------- Фильтры и анализ сигнала --------------------
      // Буферы для данных акселерометра (ось Z — перпендикулярно груди)
      const BUFFER_SIZE = 256;
      let accelZBuffer = new Float32Array(BUFFER_SIZE);
      let bufferIndex = 0;
      let bufferFilled = false;

      // Состояние для выделения дыхательной волны
      let filteredBreath = 0;        // текущее отфильтрованное значение дыхания
      let breathHistory = [];        // история пиков для вычисления вариабельности
      const BREATH_HISTORY_MAX = 12; // последние 12 периодов дыхания
      let lastBreathPeakTime = 0;
      let breathPeriod = 4000;       // начальное предположение 4 сек
      let breathPeriodMA = 4000;     // скользящее среднее периода

      // Фильтр для дыхания: полосовой 0.08-0.5 Гц, частота дискретизации ~50 Гц
      // Используем простой фильтр скользящего среднего с последующей детрендизацией
      const breathLowFreq = 0.08;
      const breathHighFreq = 0.5;
      const sampleRate = 50; // Гц, можно адаптировать под реальную частоту событий

      // -------------------- Инициализация точек --------------------
      function initPoints() {
        points = [];
        chaosOffsets = [];
        // Генерируем случайные, но постоянные смещения для хаоса (чтобы облако не мерцало)
        for (let r = 0; r < RINGS.length; r++) {
          const ring = RINGS[r];
          for (let i = 0; i < ring.count; i++) {
            // Хаотичная позиция: случайные координаты в области экрана с небольшим разбросом
            const chaoticBaseX = Math.random() * canvas.width;
            const chaoticBaseY = Math.random() * canvas.height;
            // Добавляем небольшие случайные векторы для плавного дрейфа
            const driftSpeedX = (Math.random() - 0.5) * 0.5;
            const driftSpeedY = (Math.random() - 0.5) * 0.5;
            chaosOffsets.push({
              baseX: chaoticBaseX,
              baseY: chaoticBaseY,
              driftX: driftSpeedX,
              driftY: driftSpeedY,
              // начальная фаза для шума
              phase: Math.random() * Math.PI * 2
            });
            points.push({
              ringIndex: r,
              indexInRing: i,
              angleOffset: (Math.PI * 2 * i) / ring.count,
              baseRadiusMin: ring.radiusMin,
              baseRadiusMax: ring.radiusMax,
              dotSizeMin: ring.dotMin,
              dotSizeMax: ring.dotMax,
            });
          }
        }
      }

      // -------------------- Плавная функция --------------------
      function smoothstep(t) {
        return 0.5 - 0.5 * Math.cos(Math.PI * t);
      }

      // -------------------- Отрисовка --------------------
      function draw() {
        const width = canvas.width;
        const height = canvas.height;
        ctx.clearRect(0, 0, width, height);

        const centerX = width * 0.5;
        const centerY = height * 0.43;

        // Сглаживаем когерентность
        const smoothingFactor = 0.05;
        currentCoherence += (targetCoherence - currentCoherence) * smoothingFactor;
        // Обновляем UI
        const coherencePercent = Math.round(currentCoherence * 100);
        coherenceText.textContent = `КОГЕРЕНТНОСТЬ ${coherencePercent}%`;
        coherenceFill.style.width = `${coherencePercent}%`;

        // Параметры дыхания для анимации (фаза и амплитуда)
        const breath = (Math.sin(breathPhase) + 1) * 0.5; // 0..1
        const easedBreath = smoothstep(breath);

        // Вращение колец зависит от времени и когерентности (при низкой когерентности вращение замедляется)
        const rotationFactor = currentCoherence;

        // Рисуем каждую точку
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const ring = RINGS[p.ringIndex];
          const chaos = chaosOffsets[i];

          // Идеальная позиция на кольце
          const angle = p.angleOffset + time * 0.00015 * ring.rotSpeed * rotationFactor;
          const radius = p.baseRadiusMin + (p.baseRadiusMax - p.baseRadiusMin) * easedBreath;
          const idealX = centerX + Math.cos(angle) * radius;
          const idealY = centerY + Math.sin(angle) * radius;

          // Хаотичная позиция с дрейфом (используем синусоидальный шум для плавности)
          const driftX = Math.sin(time * 0.0005 + chaos.phase) * 20 * chaos.driftX;
          const driftY = Math.cos(time * 0.0007 + chaos.phase) * 20 * chaos.driftY;
          let chaoticX = chaos.baseX + driftX;
          let chaoticY = chaos.baseY + driftY;
          // Ограничиваем, чтобы не выходило далеко за экран
          chaoticX = Math.max(0, Math.min(width, chaoticX));
          chaoticY = Math.max(0, Math.min(height, chaoticY));

          // Интерполяция позиции в зависимости от когерентности
          const x = chaoticX + (idealX - chaoticX) * currentCoherence;
          const y = chaoticY + (idealY - chaoticY) * currentCoherence;

          // Размер точки и прозрачность
          const idealSize = p.dotSizeMin + (p.dotSizeMax - p.dotSizeMin) * easedBreath;
          const chaoticSize = 3 + Math.random() * 2; // маленький случайный размер для хаоса
          const dotSize = chaoticSize + (idealSize - chaoticSize) * currentCoherence;
          const alpha = 0.3 + 0.7 * currentCoherence;

          // Свечение
          const glow = dotSize * 2 * currentCoherence;

          ctx.beginPath();
          ctx.arc(x, y, dotSize, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.shadowColor = `rgba(255, 255, 255, ${alpha * 0.5})`;
          ctx.shadowBlur = glow;
          ctx.fill();
          // Сброс тени для остальных операций (хотя здесь не критично)
          ctx.shadowBlur = 0;
        }

        // Обновляем фазу дыхания для анимации (она зависит от реального периода или модельного)
        // Если есть захваченный период дыхания, используем его, иначе по умолчанию 4 секунды
        const period = breathPeriodMA || 4000;
        breathPhase += (2 * Math.PI) / (period / 16.67); // примерно 60 fps -> 16.67ms на кадр
        if (breathPhase > 2 * Math.PI) breathPhase -= 2 * Math.PI;

        time += 16.67; // приблизительное время кадра
      }

      // -------------------- Обработка сигнала IMU --------------------
      function onDeviceMotion(event) {
        // Берем ускорение по оси Z (перпендикулярно экрану, если телефон лежит на груди экраном вверх)
        const accelZ = event.accelerationIncludingGravity?.z;
        if (accelZ === undefined || accelZ === null) return;

        // Добавляем в кольцевой буфер
        accelZBuffer[bufferIndex % BUFFER_SIZE] = accelZ;
        bufferIndex++;
        if (bufferIndex >= BUFFER_SIZE && !bufferFilled) bufferFilled = true;

        // Анализируем только когда буфер заполнен
        if (!bufferFilled) return;

        // Простая фильтрация для выделения дыхательной волны:
        // 1. Скользящее среднее для удаления высокочастотных шумов
        const windowSize = 5;
        let sum = 0;
        const startIdx = Math.max(0, bufferIndex - windowSize);
        for (let i = startIdx; i < bufferIndex; i++) {
          sum += accelZBuffer[i % BUFFER_SIZE];
        }
        const avgZ = sum / Math.min(windowSize, bufferIndex);
        // 2. Детрендинг через разность с долгосрочным средним (очень низкочастотный фильтр)
        const longTermAvg = calculateLongTermAverage();
        const detrended = avgZ - longTermAvg;
        // Обновляем отфильтрованное дыхание с экспоненциальным сглаживанием
        filteredBreath = 0.7 * filteredBreath + 0.3 * detrended;

        // Поиск пиков для определения периода дыхания
        // Простой алгоритм: пересечение нуля с положительным градиентом
        if (filteredBreath > 0 && lastFilteredBreath <= 0) {
          // Обнаружен вдох (переход через ноль вверх)
          const now = performance.now();
          if (lastBreathPeakTime !== 0) {
            const period = now - lastBreathPeakTime;
            if (period > 1000 && period < 10000) { // допустимый диапазон периода дыхания (10-60 вдохов/мин)
              breathPeriod = period;
              // Добавляем в историю для расчёта вариабельности
              breathHistory.push(period);
              if (breathHistory.length > BREATH_HISTORY_MAX) breathHistory.shift();
              // Обновляем скользящее среднее периода
              if (breathHistory.length > 1) {
                const avgPeriod = breathHistory.reduce((a, b) => a + b, 0) / breathHistory.length;
                breathPeriodMA = avgPeriod;
              }
            }
          }
          lastBreathPeakTime = now;
        }
        lastFilteredBreath = filteredBreath;

        // Вычисление когерентности на основе стабильности дыхания (BRV)
        if (breathHistory.length >= 3) {
          const meanPeriod = breathHistory.reduce((a, b) => a + b, 0) / breathHistory.length;
          const variance = breathHistory.reduce((sum, p) => sum + Math.pow(p - meanPeriod, 2), 0) / breathHistory.length;
          const stdDev = Math.sqrt(variance);
          // Нормализованная вариабельность: CV = stdDev / mean
          const cv = stdDev / meanPeriod;
          // Когерентность: чем меньше CV, тем ближе к 1. Используем экспоненциальное преобразование
          const coherence = Math.exp(-5 * cv); // подбираем коэффициент для чувствительности
          targetCoherence = Math.min(1, Math.max(0, coherence));
        } else {
          targetCoherence = 0; // недостаточно данных
        }
      }

      let lastFilteredBreath = 0;
      let longTermSum = 0;
      let longTermCount = 0;

      function calculateLongTermAverage() {
        // Простое долгосрочное среднее по всему буферу
        let sum = 0;
        const count = Math.min(bufferIndex, BUFFER_SIZE);
        for (let i = 0; i < count; i++) {
          sum += accelZBuffer[i % BUFFER_SIZE];
        }
        return sum / count;
      }

      // -------------------- Запуск и остановка датчиков --------------------
      let sensorActive = false;

      function startSensors() {
        if (sensorActive) return;
        // Проверка поддержки DeviceMotionEvent
        if (typeof DeviceMotionEvent !== 'undefined') {
          // Для iOS необходимо запросить разрешение (только для устройств с iOS 13+)
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission()
              .then(permissionState => {
                if (permissionState === 'granted') {
                  window.addEventListener('deviceorientation', onDeviceMotion);
                  sensorActive = true;
                  startBtn.textContent = 'ПАУЗА';
                  console.log('Датчики активированы');
                } else {
                  alert('Разрешение на доступ к датчикам отклонено');
                }
              })
              .catch(console.error);
          } else {
            // Android или старые iOS
            window.addEventListener('deviceorientation', onDeviceMotion);
            sensorActive = true;
            startBtn.textContent = 'ПАУЗА';
          }
        } else {
          alert('Ваше устройство не поддерживает датчики движения');
        }
      }

      function stopSensors() {
        if (!sensorActive) return;
        window.removeEventListener('deviceorientation', onDeviceMotion);
        sensorActive = false;
        startBtn.textContent = 'СТАРТ';
        // Сброс буфера
        bufferIndex = 0;
        bufferFilled = false;
        breathHistory = [];
        targetCoherence = 0;
      }

      // Кнопка старт/стоп
      startBtn.addEventListener('click', () => {
        if (sensorActive) {
          stopSensors();
        } else {
          startSensors();
        }
      });

      // -------------------- Анимационный цикл --------------------
      function animationLoop() {
        draw();
        requestAnimationFrame(animationLoop);
      }

      // -------------------- Адаптация размера canvas --------------------
      function resize() {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
        ctx.setTransform(
          window.devicePixelRatio, 0,
          0, window.devicePixelRatio,
          0, 0
        );
        // Переинициализируем хаотичные позиции при изменении размера, чтобы они оставались в пределах экрана
        if (chaosOffsets.length > 0) {
          for (let i = 0; i < chaosOffsets.length; i++) {
            chaosOffsets[i].baseX = Math.random() * canvas.width;
            chaosOffsets[i].baseY = Math.random() * canvas.height;
          }
        }
      }

      window.addEventListener('resize', resize);

      // -------------------- Инициализация --------------------
      function init() {
        resize();
        initPoints();
        // Запускаем анимацию
        animationLoop();
        // По умолчанию датчики выключены, пользователь нажимает кнопку
        startBtn.textContent = 'СТАРТ';
        // Для теста можно сразу включить, но лучше по кнопке
      }

      init();
    })();
  </script>
</body>
</html>
