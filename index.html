<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ровное дыхание — IMU Biofeedback (гироскоп Z, фикс)</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:system-ui,sans-serif; }
    canvas { display:block; width:100vw; height:100vh; }
    #ui { position:absolute; bottom:20px; left:0; width:100%; display:flex; flex-direction:column; align-items:center; gap:10px; color:white; z-index:10; pointer-events:none; }
    .stability-bar { width:80%; max-width:300px; height:8px; background:rgba(255,255,255,0.2); border-radius:4px; overflow:hidden; margin-top:5px; }
    .stability-fill { height:100%; width:0%; background:linear-gradient(90deg,#ff4d4d,#ffdd57,#4caf50); border-radius:4px; transition:width 0.2s ease; }
    #stability-text { font-size:16px; letter-spacing:2px; color:rgba(255,255,255,0.8); }
    button { pointer-events:auto; padding:10px 20px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:white; border-radius:30px; font-size:14px; backdrop-filter:blur(10px); cursor:pointer; margin:0 5px; }
    button:hover { background:rgba(255,255,255,0.25); }
    #controls { display:flex; gap:10px; margin-top:5px; }
    .info { font-size:12px; color:rgba(255,255,255,0.5); max-width:80%; text-align:center; }
    #debug { position:absolute; top:10px; left:10px; color:rgba(255,255,255,0.6); font-size:12px; z-index:10; pointer-events:none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="debug">Период: --с | Стаб: 0%</div>
  <div id="ui">
    <div id="stability-text">СТАБИЛЬНОСТЬ 0%</div>
    <div class="stability-bar"><div id="stability-fill" class="stability-fill"></div></div>
    <div id="controls">
      <button id="start-btn">СТАРТ</button>
      <button id="gain-down">Gain −</button>
      <button id="gain-up">Gain +</button>
    </div>
    <div class="info">Положите телефон на грудь экраном вверх и дышите медленно</div>
  </div>

  <script>
    (()=>{
      // DOM
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      const startBtn = document.getElementById('start-btn');
      const stabilityText = document.getElementById('stability-text');
      const stabilityFill = document.getElementById('stability-fill');
      const debugEl = document.getElementById('debug');
      const gainUpBtn = document.getElementById('gain-up');
      const gainDownBtn = document.getElementById('gain-down');

      // Визуализация колец
      const RINGS = [
        { count:28, rMin:55, rMax:110, dMin:6, dMax:10, rot:0.20 },
        { count:32, rMin:85, rMax:165, dMin:7, dMax:10, rot:0.10 },
        { count:36, rMin:115, rMax:220, dMin:6, dMax:11, rot:0.05 },
        { count:40, rMin:145, rMax:285, dMin:6, dMax:14, rot:0.025 }
      ];
      let points = [], chaosOffsets = [];

      // Анимация
      let targetStability = 0, currentStability = 0;
      let breathPhase = 0, simTime = 0, lastFrameTs = 0;

      // График дыхания
      const BREATH_HIST = 400;
      let breathGraph = new Float32Array(BREATH_HIST);
      let graphIdx = 0, graphFull = false;

      // Сигнал
      let sensorActive = false;
      let signalGain = 1.0;

      // Буфер для автокорреляции (5 секунд, ~50 Гц)
      const RAW_BUF_LEN = 256;
      let rawBuffer = new Float32Array(RAW_BUF_LEN);
      let rawBufIdx = 0, rawBufFull = false;

      // Оценка периода
      const MAX_PERIODS = 8;
      let periodEstimates = [];
      let currentPeriodMs = 4000;
      let lastValidPeriodMs = 0; // чтобы анимация не скакала

      // Фильтр для визуализации дыхания
      class SimpleBandpass {
        constructor() { this.fast = 0; this.slow = 0; this.init = false; }
        process(x, dtMs) {
          if(!this.init) { this.fast = this.slow = x; this.init = true; return 0; }
          const aFast = Math.min(1, dtMs/1000 / 0.22);
          const aSlow = Math.min(1, dtMs/1000 / 1.8);
          this.fast += aFast * (x - this.fast);
          this.slow += aSlow * (x - this.slow);
          return this.fast - this.slow;
        }
        reset() { this.fast = this.slow = 0; this.init = false; }
      }
      const bandpass = new SimpleBandpass();

      let prevRawTime = 0;

      // Управление усилением
      gainUpBtn.addEventListener('click', ()=> { signalGain = Math.min(5.0, signalGain+0.2); });
      gainDownBtn.addEventListener('click', ()=> { signalGain = Math.max(0.2, signalGain-0.2); });

      function initPoints() {
        points = []; chaosOffsets = [];
        const w = window.innerWidth, h = window.innerHeight;
        for (let r=0; r<RINGS.length; r++) {
          const ring = RINGS[r];
          for (let i=0; i<ring.count; i++) {
            chaosOffsets.push({
              bx: Math.random()*w, by: Math.random()*h,
              dx: (Math.random()-0.5)*0.5, dy: (Math.random()-0.5)*0.5,
              ph: Math.random()*Math.PI*2
            });
            points.push({
              ring:r, idx:i,
              ang: (2*Math.PI*i)/ring.count,
              rMin:ring.rMin, rMax:ring.rMax,
              dMin:ring.dMin, dMax:ring.dMax,
              jit:0.6+Math.random()*1.2
            });
          }
        }
      }

      function resize() {
        const dpr = window.devicePixelRatio||1;
        const w=window.innerWidth, h=window.innerHeight;
        canvas.width = Math.round(w*dpr);
        canvas.height = Math.round(h*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
        if(chaosOffsets.length) {
          for(let i=0;i<chaosOffsets.length;i++) {
            chaosOffsets[i].bx = Math.random()*w;
            chaosOffsets[i].by = Math.random()*h;
          }
        }
      }
      window.addEventListener('resize', resize);

      // Автокорреляция с проверкой качества
      function computePeriodFromBuffer(buf, length, fsEstimate) {
        const minLag = Math.floor(fsEstimate * 1.0);   // 1 сек
        const maxLag = Math.min(length-1, Math.floor(fsEstimate * 10.0)); // 10 сек
        if (minLag >= maxLag) return 0;

        // Среднее и дисперсия
        let sum = 0;
        for (let i=0; i<length; i++) sum += buf[i];
        const mean = sum / length;
        let totalVar = 0;
        for (let i=0; i<length; i++) totalVar += (buf[i] - mean) ** 2;
        if (totalVar === 0) return 0;

        let bestLag = minLag;
        let bestCorr = -Infinity;
        for (let lag = minLag; lag <= maxLag; lag++) {
          let corr = 0;
          for (let i=0; i<length-lag; i++) {
            corr += (buf[i] - mean) * (buf[i+lag] - mean);
          }
          if (corr > bestCorr) {
            bestCorr = corr;
            bestLag = lag;
          }
        }

        // Нормированный коэффициент автокорреляции
        const normCorr = bestCorr / totalVar;
        if (normCorr < 0.2) return 0; // слишком слабая корреляция — не добавляем

        return bestLag / fsEstimate * 1000; // период в мс
      }

      function processMotion(gz, ts) {
        if (!isFinite(gz)) return;
        const amplified = gz * signalGain;

        rawBuffer[rawBufIdx % RAW_BUF_LEN] = amplified;
        rawBufIdx++;
        if (rawBufIdx >= RAW_BUF_LEN && !rawBufFull) rawBufFull = true;

        const dtMs = prevRawTime ? Math.max(1, ts - prevRawTime) : 20;
        prevRawTime = ts;
        const filtered = bandpass.process(amplified, dtMs);
        breathGraph[graphIdx % BREATH_HIST] = filtered;
        graphIdx++;
        if (graphIdx >= BREATH_HIST && !graphFull) graphFull = true;

        // Оценка периода каждые 10 новых отсчётов
        if (rawBufFull && rawBufIdx % 10 === 0) {
          const ordered = new Float32Array(RAW_BUF_LEN);
          const start = rawBufIdx % RAW_BUF_LEN;
          for (let i=0; i<RAW_BUF_LEN; i++) {
            ordered[i] = rawBuffer[(start + i) % RAW_BUF_LEN];
          }
          const fs = 50;
          const periodMs = computePeriodFromBuffer(ordered, RAW_BUF_LEN, fs);
          if (periodMs >= 1000 && periodMs <= 10000) {
            periodEstimates.push(periodMs);
            if (periodEstimates.length > MAX_PERIODS) periodEstimates.shift();
            lastValidPeriodMs = periodEstimates.reduce((a,b)=>a+b,0) / periodEstimates.length;
          }
        }
        // Обновляем текущий период, даже если новых оценок нет — сглаживаем
        if (lastValidPeriodMs > 0) {
          currentPeriodMs += (lastValidPeriodMs - currentPeriodMs) * 0.1;
        }
      }

      function onDeviceMotion(e) {
        const r = e.rotationRate;
        if (!r) return;
        processMotion(r.z ?? 0, performance.now());
      }

      function computeStability() {
        if (periodEstimates.length < 3) return 0;
        const mean = periodEstimates.reduce((a,b)=>a+b,0) / periodEstimates.length;
        const variance = periodEstimates.reduce((s,v)=>s+(v-mean)**2,0) / periodEstimates.length;
        const cv = Math.sqrt(variance)/mean;
        return Math.max(0, 1 - cv/0.15);
      }

      async function startSensors() {
        if (sensorActive) return;
        if (typeof DeviceMotionEvent === 'undefined') { alert('Датчики не поддерживаются'); return; }
        try {
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const p = await DeviceMotionEvent.requestPermission();
            if (p !== 'granted') { alert('Разрешение отклонено'); return; }
          }
          window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
          sensorActive = true;
          startBtn.textContent = 'ПАУЗА';
        } catch(e) { alert('Ошибка'); }
      }

      function stopSensors() {
        if (!sensorActive) return;
        window.removeEventListener('devicemotion', onDeviceMotion);
        sensorActive = false;
        startBtn.textContent = 'СТАРТ';
        rawBufIdx = 0; rawBufFull = false; rawBuffer.fill(0);
        periodEstimates = []; currentPeriodMs = 4000; lastValidPeriodMs = 0;
        bandpass.reset();
        graphIdx = 0; graphFull = false; breathGraph.fill(0);
        prevRawTime = 0;
        targetStability = 0;
      }

      startBtn.addEventListener('click', ()=> sensorActive ? stopSensors() : startSensors());

      // Отрисовка
      function draw(ts) {
        if (!lastFrameTs) lastFrameTs = ts;
        const dt = Math.min(50, ts - lastFrameTs);
        lastFrameTs = ts;
        simTime += dt;

        const w = window.innerWidth, h = window.innerHeight;
        ctx.clearRect(0,0,w,h);

        // Обновление стабильности (FPS-независимо)
        const rawStab = computeStability();
        targetStability = rawStab;
        const alphaSmooth = 1 - Math.exp(-dt/600);
        currentStability += (targetStability - currentStability) * alphaSmooth;
        const stabPercent = Math.round(currentStability*100);
        stabilityText.textContent = `СТАБИЛЬНОСТЬ ${stabPercent}%`;
        stabilityFill.style.width = `${stabPercent}%`;

        // Период для анимации дыхания
        const periodAnim = currentPeriodMs || 4000;
        breathPhase += (2*Math.PI) * (dt/periodAnim);
        breathPhase %= (2*Math.PI);
        const breath = (Math.sin(breathPhase)+1)/2;
        const eased = smoothstep(breath);
        const rotFactor = currentStability;

        const cx = w * 0.5, cy = h * 0.38;
        const aspectRatio = w / h; // компенсация вытянутости экрана

        // Точки
        for (let i=0; i<points.length; i++) {
          const p = points[i];
          const ring = RINGS[p.ring];
          const ch = chaosOffsets[i];

          const angle = p.ang + simTime * 0.00015 * ring.rot * rotFactor;
          const radius = p.rMin + (p.rMax - p.rMin) * eased;
          // Идеальная позиция с учётом aspect ratio, чтобы кольца были круглыми
          const ix = cx + Math.cos(angle) * radius;
          const iy = cy + Math.sin(angle) * radius * aspectRatio;

          const dx = Math.sin(simTime*0.0005 + ch.ph) * 20 * ch.dx;
          const dy = Math.cos(simTime*0.0007 + ch.ph) * 20 * ch.dy;
          const chX = clamp(ch.bx + dx, 0, w);
          const chY = clamp(ch.by + dy, 0, h);

          const x = chX + (ix - chX) * currentStability;
          const y = chY + (iy - chY) * currentStability;

          const idealSize = p.dMin + (p.dMax - p.dMin) * eased;
          const size = p.jit + (idealSize - p.jit) * currentStability;
          const alpha = 0.3 + 0.7 * currentStability;
          const glow = size * 2 * currentStability;

          ctx.beginPath();
          ctx.arc(x, y, size, 0, 2*Math.PI);
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.shadowColor = `rgba(255,255,255,${alpha*0.5})`;
          ctx.shadowBlur = glow;
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // График дыхания
        const gy = h * 0.82, gh = 60, gx = 20, gw = w - 40;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(gx-5, gy-gh/2-5, gw+10, gh+10);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx+gw, gy); ctx.stroke();

        const cnt = graphFull ? BREATH_HIST : graphIdx;
        if (cnt > 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          const start = graphFull ? graphIdx : 0;
          const step = Math.max(1, Math.floor(cnt / gw));
          for (let i=0; i < cnt-1; i += step) {
            const i1 = (start + i) % BREATH_HIST;
            const i2 = (start + i + step) % BREATH_HIST;
            const v1 = breathGraph[i1], v2 = breathGraph[i2];
            const x1 = gx + (i/(cnt-1)) * gw;
            const x2 = gx + ((i+step)/(cnt-1)) * gw;
            ctx.moveTo(x1, gy - v1 * 15);
            ctx.lineTo(x2, gy - v2 * 15);
          }
          ctx.stroke();
        }

        // Отладка
        const periodSec = currentPeriodMs ? (currentPeriodMs/1000).toFixed(1) : '--';
        debugEl.textContent = `Период: ${periodSec}с | Стаб: ${stabPercent}% | Gain: ${signalGain.toFixed(1)}`;

        requestAnimationFrame(draw);
      }

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function smoothstep(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

      function init() {
        resize();
        initPoints();
        startBtn.textContent = 'СТАРТ';
        requestAnimationFrame(draw);
      }
      init();
    })();
  </script>
</body>
</html>
