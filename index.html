<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPG Breathing Animation</title>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    /* background:#111214; */
    background: #000;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

</style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);

const rings = [

{
    count: 28,
    radiusMin: 55,
    radiusMax: 110,
    dotMin: 6,
    dotMax: 10,
    rotationSpeed: 0.20*10
},

{
    count: 32,
    radiusMin: 85,
    radiusMax: 165,
    dotMin: 7,
    dotMax: 10,
    rotationSpeed: 0.10*10
},

{
    count: 36,
    radiusMin: 115,
    radiusMax: 220,
    dotMin: 6,
    dotMax: 11,
    rotationSpeed: 0.05*10
},

{
    count: 40,
    radiusMin: 145,
    radiusMax: 285,
    dotMin: 6,
    dotMax: 14,
    rotationSpeed: 0.025*10
}

];

function smooth(t){

    return 0.5 -
           0.5 *
           Math.cos(Math.PI * t);
}

function render(time){

    const width = window.innerWidth;
    const height = window.innerHeight;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    const centerX = width * 0.5;
    const centerY = height * 0.43;

    const breath =
        (Math.sin(time * 0.00075) + 1)
        * 0.5;

    const eased =
        smooth(breath);

    rings.forEach((ring,index)=>{

        const radius =
            ring.radiusMin +
            (ring.radiusMax -
             ring.radiusMin)
            * eased;

        const dotSize =
            ring.dotMin +
            (ring.dotMax -
             ring.dotMin)
            * eased;

        const rotation =
            time *
            0.00015 *
            ring.rotationSpeed;

        for(
            let i = 0;
            i < ring.count;
            i++
        ){

            const angle =
                (
                    Math.PI * 2 *
                    i /
                    ring.count
                )
                + rotation;

            const x =
                centerX +
                Math.cos(angle)
                * radius;

            const y =
                centerY +
                Math.sin(angle)
                * radius;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                dotSize,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ffffff";

            ctx.shadowColor =
                "rgba(255,255,255,0.5)";

            ctx.shadowBlur =
                dotSize * 2;

            ctx.fill();
        }
    });

    requestAnimationFrame(
        render
    );
}

requestAnimationFrame(
    render
);

</script>

</body>
</html>
