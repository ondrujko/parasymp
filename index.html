<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ровное дыхание — IMU Biofeedback</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: white;
      z-index: 10;
      pointer-events: none;
    }
    .stability-bar {
      width: 80%;
      max-width: 300px;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }
    .stability-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d4d, #ffdd57, #4caf50);
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    #stability-text {
      font-size: 16px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.8);
    }
    button {
      pointer-events: auto;
      padding: 12px 24px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 30px;
      font-size: 16px;
      backdrop-filter: blur(10px);
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.25); }
    button:active { background: rgba(255,255,255,0.4); }
    .info {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      max-width: 80%;
      text-align: center;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="stability-text">СТАБИЛЬНОСТЬ 0%</div>
    <div class="stability-bar">
      <div id="stability-fill" class="stability-fill"></div>
    </div>
    <button id="start-btn">СТАРТ</button>
    <div class="info">Положите телефон на грудь экраном вверх и дышите медленно (5-6 вдохов/мин)</div>
  </div>

  <script>
    (() => {
      // -------------------- DOM --------------------
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      const startBtn = document.getElementById('start-btn');
      const stabilityText = document.getElementById('stability-text');
      const stabilityFill = document.getElementById('stability-fill');

      // -------------------- Визуальные параметры --------------------
      const RINGS = [
        { count: 28, radiusMin: 55,  radiusMax: 110, dotMin: 6, dotMax: 10, rotSpeed: 0.20 },
        { count: 32, radiusMin: 85,  radiusMax: 165, dotMin: 7, dotMax: 10, rotSpeed: 0.10 },
        { count: 36, radiusMin: 115, radiusMax: 220, dotMin: 6, dotMax: 11, rotSpeed: 0.05 },
        { count: 40, radiusMin: 145, radiusMax: 285, dotMin: 6, dotMax: 14, rotSpeed: 0.025 }
      ];

      let points = [];
      let chaosOffsets = [];

      // -------------------- Состояние анимации --------------------
      let targetStability = 0;      // целевая ровность дыхания (0..1)
      let currentStability = 0;     // сглаженная
      let breathPhase = 0;          // фаза для анимации колец
      let simTime = 0;              // накопленное время для вращения (мс)
      let lastFrameTs = 0;

      // -------------------- График дыхания --------------------
      const BREATH_HISTORY_LENGTH = 400; // точек на графике
      let breathGraph = new Float32Array(BREATH_HISTORY_LENGTH);
      let breathGraphIndex = 0;
      let breathGraphFilled = false;

      // -------------------- Обработка сигнала (ось Z) --------------------
      let sensorActive = false;

      // Фильтры
      let baselineFast = 0;
      let baselineSlow = 0;
      let signalInitialized = false;

      // Для детектора локального максимума
      let prevSignal2 = 0;
      let prevSignal1 = 0;
      let prevTime1 = 0;
      let prevTime2 = 0;

      // История периодов дыхания
      let breathPeriods = [];
      const BREATH_HISTORY_MAX = 12;
      let lastPeakTime = 0;

      // Порог амплитуды (адаптивный)
      let noiseEma = 0;

      // Параметры фильтров (в секундах)
      const FAST_TAU = 0.22;
      const SLOW_TAU = 1.8;
      const NOISE_TAU = 2.5;

      // Защита от выбросов
      const MAX_DELTA = 1.5; // максимально допустимое изменение между отсчетами
      let previousRaw = null;

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function emaAlpha(dtMs, tauSec) {
        const dt = dtMs / 1000;
        return dt / (tauSec + dt);
      }

      function smoothstep(t) {
        return 0.5 - 0.5 * Math.cos(Math.PI * t);
      }

      // -------------------- Инициализация точек --------------------
      function initPoints() {
        points = [];
        chaosOffsets = [];
        const width = window.innerWidth;
        const height = window.innerHeight;

        for (let r = 0; r < RINGS.length; r++) {
          const ring = RINGS[r];
          for (let i = 0; i < ring.count; i++) {
            chaosOffsets.push({
              baseX: Math.random() * width,
              baseY: Math.random() * height,
              driftX: (Math.random() - 0.5) * 0.5,
              driftY: (Math.random() - 0.5) * 0.5,
              phase: Math.random() * Math.PI * 2
            });
            points.push({
              ringIndex: r,
              indexInRing: i,
              angleOffset: (Math.PI * 2 * i) / ring.count,
              baseRadiusMin: ring.radiusMin,
              baseRadiusMax: ring.radiusMax,
              dotSizeMin: ring.dotMin,
              dotSizeMax: ring.dotMax,
              sizeJitter: 0.6 + Math.random() * 1.2
            });
          }
        }
      }

      // -------------------- Размер canvas --------------------
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (chaosOffsets.length > 0) {
          for (let i = 0; i < chaosOffsets.length; i++) {
            chaosOffsets[i].baseX = Math.random() * width;
            chaosOffsets[i].baseY = Math.random() * height;
          }
        }
      }
      window.addEventListener('resize', resize);

      // -------------------- Обработка сигнала --------------------
      function processMotionSample(rawValue, nowTs) {
        if (!isFinite(rawValue)) return;

        // Защита от выбросов
        if (previousRaw !== null) {
          const delta = rawValue - previousRaw;
          if (Math.abs(delta) > MAX_DELTA) {
            // Пропускаем выброс, но обновляем previousRaw, чтобы не потерять контекст
            previousRaw = rawValue;
            return;
          }
        }
        previousRaw = rawValue;

        // Инициализация фильтров
        if (!signalInitialized) {
          baselineFast = rawValue;
          baselineSlow = rawValue;
          prevSignal2 = 0;
          prevSignal1 = 0;
          prevTime1 = nowTs;
          prevTime2 = nowTs;
          signalInitialized = true;
          return;
        }

        const dt1 = Math.max(1, nowTs - prevTime1);
        const aFast = emaAlpha(dt1, FAST_TAU);
        const aSlow = emaAlpha(dt1, SLOW_TAU);
        const aNoise = emaAlpha(dt1, NOISE_TAU);

        baselineFast += aFast * (rawValue - baselineFast);
        baselineSlow += aSlow * (rawValue - baselineSlow);

        const bandPassed = baselineFast - baselineSlow;

        // Обновление уровня шума (для адаптивного порога)
        noiseEma += aNoise * (Math.abs(bandPassed) - noiseEma);
        const threshold = Math.max(0.02, noiseEma * 1.25);

        // Сохраняем в график дыхания
        breathGraph[breathGraphIndex % BREATH_HISTORY_LENGTH] = bandPassed;
        breathGraphIndex++;
        if (breathGraphIndex >= BREATH_HISTORY_LENGTH && !breathGraphFilled) breathGraphFilled = true;

        // Детектор локального максимума
        const peakCandidate = prevSignal1;
        const peakTimeCandidate = prevTime1;
        const minPeriodMs = 1200;  // ~50 вдохов/мин
        const maxPeriodMs = 10000; // ~6 вдохов/мин

        if (
          peakCandidate > threshold &&
          peakCandidate > prevSignal2 &&
          peakCandidate >= bandPassed &&
          (peakTimeCandidate - lastPeakTime) > minPeriodMs &&
          (peakTimeCandidate - lastPeakTime) < maxPeriodMs
        ) {
          if (lastPeakTime !== 0) {
            const period = peakTimeCandidate - lastPeakTime;
            breathPeriods.push(period);
            if (breathPeriods.length > BREATH_HISTORY_MAX) breathPeriods.shift();

            if (breathPeriods.length >= 3) {
              const mean = breathPeriods.reduce((a, b) => a + b, 0) / breathPeriods.length;
              const variance = breathPeriods.reduce((sum, p) => sum + (p - mean) * (p - mean), 0) / breathPeriods.length;
              const stdDev = Math.sqrt(variance);
              const cv = stdDev / mean;
              // Чем меньше вариабельность периода, тем выше стабильность
              const stability = Math.exp(-6 * cv);
              targetStability = clamp(stability, 0, 1);
            } else {
              targetStability = 0;
            }
          }
          lastPeakTime = peakTimeCandidate;
        }

        prevSignal2 = prevSignal1;
        prevSignal1 = bandPassed;
        prevTime2 = prevTime1;
        prevTime1 = nowTs;
      }

      function onDeviceMotion(event) {
        const a = event.accelerationIncludingGravity;
        if (!a) return;
        const az = typeof a.z === 'number' ? a.z : 0;
        const now = performance.now();
        processMotionSample(az, now);
      }

      // -------------------- Запуск / остановка --------------------
      async function startSensors() {
        if (sensorActive) return;
        if (typeof DeviceMotionEvent === 'undefined') {
          alert('Ваше устройство не поддерживает датчики движения');
          return;
        }
        try {
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const permissionState = await DeviceMotionEvent.requestPermission();
            if (permissionState !== 'granted') {
              alert('Разрешение на доступ к датчикам отклонено');
              return;
            }
          }
          window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
          sensorActive = true;
          startBtn.textContent = 'ПАУЗА';
        } catch (err) {
          console.error(err);
          alert('Не удалось активировать датчики');
        }
      }

      function stopSensors() {
        if (!sensorActive) return;
        window.removeEventListener('devicemotion', onDeviceMotion);
        sensorActive = false;
        startBtn.textContent = 'СТАРТ';
        // Полный сброс состояния
        baselineFast = 0;
        baselineSlow = 0;
        signalInitialized = false;
        prevSignal2 = 0;
        prevSignal1 = 0;
        prevTime1 = 0;
        prevTime2 = 0;
        breathPeriods = [];
        lastPeakTime = 0;
        noiseEma = 0;
        targetStability = 0;
        previousRaw = null;
        breathGraphIndex = 0;
        breathGraphFilled = false;
        breathGraph.fill(0);
      }

      startBtn.addEventListener('click', () => {
        if (sensorActive) stopSensors();
        else startSensors();
      });

      // -------------------- Отрисовка --------------------
      function draw(ts) {
        if (!lastFrameTs) lastFrameTs = ts;
        const dt = Math.min(50, ts - lastFrameTs);
        lastFrameTs = ts;
        simTime += dt;

        const width = window.innerWidth;
        const height = window.innerHeight;
        ctx.clearRect(0, 0, width, height);

        const centerX = width * 0.5;
        const centerY = height * 0.43;

        // FPS-независимое сглаживание стабильности (постоянная времени 500 мс)
        const smoothingAlpha = 1 - Math.exp(-dt / 500);
        currentStability += (targetStability - currentStability) * smoothingAlpha;
        const stabilityPercent = Math.round(currentStability * 100);
        stabilityText.textContent = `СТАБИЛЬНОСТЬ ${stabilityPercent}%`;
        stabilityFill.style.width = `${stabilityPercent}%`;

        // Оценка периода дыхания для анимации колец
        const estimatedPeriod = breathPeriods.length >= 1
          ? breathPeriods.reduce((a, b) => a + b, 0) / breathPeriods.length
          : 4000;
        breathPhase += (2 * Math.PI) * (dt / estimatedPeriod);
        breathPhase %= (Math.PI * 2);

        const breath = (Math.sin(breathPhase) + 1) * 0.5;
        const easedBreath = smoothstep(breath);

        // Вращение
        const rotationFactor = currentStability;

        // ---- Рисуем облако / кольца ----
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const ring = RINGS[p.ringIndex];
          const chaos = chaosOffsets[i];

          const angle = p.angleOffset + simTime * 0.00015 * ring.rotSpeed * rotationFactor;
          const radius = p.baseRadiusMin + (p.baseRadiusMax - p.baseRadiusMin) * easedBreath;
          const idealX = centerX + Math.cos(angle) * radius;
          const idealY = centerY + Math.sin(angle) * radius;

          const driftX = Math.sin(simTime * 0.0005 + chaos.phase) * 20 * chaos.driftX;
          const driftY = Math.cos(simTime * 0.0007 + chaos.phase) * 20 * chaos.driftY;
          const chaoticX = clamp(chaos.baseX + driftX, 0, width);
          const chaoticY = clamp(chaos.baseY + driftY, 0, height);

          const x = chaoticX + (idealX - chaoticX) * currentStability;
          const y = chaoticY + (idealY - chaoticY) * currentStability;

          const idealSize = p.dotSizeMin + (p.dotSizeMax - p.dotSizeMin) * easedBreath;
          const chaoticSize = p.sizeJitter;
          const dotSize = chaoticSize + (idealSize - chaoticSize) * currentStability;
          const alpha = 0.3 + 0.7 * currentStability;
          const glow = dotSize * 2 * currentStability;

          ctx.beginPath();
          ctx.arc(x, y, dotSize, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.shadowColor = `rgba(255, 255, 255, ${alpha * 0.5})`;
          ctx.shadowBlur = glow;
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // ---- График дыхания ----
        const graphY = height * 0.82;
        const graphHeight = 60;
        const graphWidth = width - 40;
        const graphLeft = 20;
        const graphCenterY = graphY;

        // Полупрозрачный фон
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(graphLeft - 5, graphY - graphHeight/2 - 5, graphWidth + 10, graphHeight + 10);

        // Центральная линия
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(graphLeft, graphCenterY);
        ctx.lineTo(graphLeft + graphWidth, graphCenterY);
        ctx.stroke();

        // График сигнала
        const count = breathGraphFilled ? BREATH_HISTORY_LENGTH : breathGraphIndex;
        if (count > 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          const startIdx = breathGraphFilled ? breathGraphIndex : 0;
          const step = Math.max(1, Math.floor(count / graphWidth));
          for (let i = 0; i < count - 1; i += step) {
            const idx1 = (startIdx + i) % BREATH_HISTORY_LENGTH;
            const idx2 = (startIdx + i + step) % BREATH_HISTORY_LENGTH;
            const v1 = breathGraph[idx1];
            const v2 = breathGraph[idx2];
            const x1 = graphLeft + (i / (count - 1)) * graphWidth;
            const x2 = graphLeft + ((i + step) / (count - 1)) * graphWidth;
            const y1 = graphCenterY - v1 * 15; // масштаб
            const y2 = graphCenterY - v2 * 15;
            if (i === 0) ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
          }
          ctx.stroke();
        }

        requestAnimationFrame(draw);
      }

      // -------------------- Инициализация --------------------
      function init() {
        resize();
        initPoints();
        startBtn.textContent = 'СТАРТ';
        requestAnimationFrame(draw);
      }

      init();
    })();
  </script>
</body>
</html>
