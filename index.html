<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ровное дыхание — IMU Biofeedback</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      color: white; z-index: 10; pointer-events: none;
    }
    .stability-bar {
      width: 80%; max-width: 300px; height: 8px; background: rgba(255,255,255,0.2);
      border-radius: 4px; overflow: hidden; margin-top: 5px;
    }
    .stability-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #ff4d4d, #ffdd57, #4caf50);
      border-radius: 4px; transition: width 0.2s ease;
    }
    #stability-text { font-size: 16px; letter-spacing: 2px; color: rgba(255,255,255,0.8); }
    button {
      pointer-events: auto; padding: 12px 24px; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 30px;
      font-size: 16px; backdrop-filter: blur(10px); cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: rgba(255,255,255,0.25); }
    button:active { background: rgba(255,255,255,0.4); }
    .info {
      font-size: 12px; color: rgba(255,255,255,0.5); max-width: 80%; text-align: center; margin-top: 5px;
    }
    #debug {
      position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.6); font-size: 12px;
      z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="debug">Пиков: 0 | Период: --</div>
  <div id="ui">
    <div id="stability-text">СТАБИЛЬНОСТЬ 0%</div>
    <div class="stability-bar"><div id="stability-fill" class="stability-fill"></div></div>
    <button id="start-btn">СТАРТ</button>
    <div class="info">Положите телефон на грудь экраном вверх и дышите медленно</div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      const startBtn = document.getElementById('start-btn');
      const stabilityText = document.getElementById('stability-text');
      const stabilityFill = document.getElementById('stability-fill');
      const debugEl = document.getElementById('debug');

      // Параметры колец
      const RINGS = [
        { count: 28, rMin: 55, rMax: 110, dMin: 6, dMax: 10, rot: 0.20 },
        { count: 32, rMin: 85, rMax: 165, dMin: 7, dMax: 10, rot: 0.10 },
        { count: 36, rMin: 115, rMax: 220, dMin: 6, dMax: 11, rot: 0.05 },
        { count: 40, rMin: 145, rMax: 285, dMin: 6, dMax: 14, rot: 0.025 }
      ];

      let points = [];
      let chaosOffsets = [];

      // Состояние анимации
      let targetStability = 0;
      let currentStability = 0;
      let breathPhase = 0;
      let simTime = 0;
      let lastFrameTs = 0;

      // График дыхания
      const BREATH_HISTORY = 400;
      let breathGraph = new Float32Array(BREATH_HISTORY);
      let graphIdx = 0;
      let graphFull = false;

      // Сигнальный тракт
      let sensorActive = false;
      let rawBaseline = null;          // текущее среднее значение (гравитация)
      let bandPassed = 0;
      let prevBandPassed = 0;

      // Нормализация амплитуды
      let envMax = 0.1;               // верхняя огибающая
      let envMin = -0.1;              // нижняя огибающая
      const ENV_TAU = 2.0;            // постоянная времени для огибающих

      // Детектор пересечений нуля с гистерезисом
      let prevSign = 0;               // знак предыдущего значения
      let crossTimes = [];            // времена последних пересечений нуля (вверх)
      const MAX_CROSS = 12;
      let lastCrossTime = 0;
      const MIN_PERIOD = 1500;        // мс (40 вдохов/мин)
      const MAX_PERIOD = 12000;       // мс (5 вдохов/мин)

      // Предыдущее сырое значение для защиты от выбросов
      let prevRaw = null;
      const MAX_DELTA = 2.0;

      function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
      function emaAlpha(dtMs, tauSec) { return (dtMs/1000) / (tauSec + dtMs/1000); }
      function smoothstep(t) { return 0.5 - 0.5 * Math.cos(Math.PI * t); }

      function initPoints() {
        points = [];
        chaosOffsets = [];
        const w = window.innerWidth, h = window.innerHeight;
        for (let r = 0; r < RINGS.length; r++) {
          const ring = RINGS[r];
          for (let i = 0; i < ring.count; i++) {
            chaosOffsets.push({
              bx: Math.random() * w,
              by: Math.random() * h,
              dx: (Math.random() - 0.5) * 0.5,
              dy: (Math.random() - 0.5) * 0.5,
              ph: Math.random() * Math.PI * 2
            });
            points.push({
              ring: r,
              idx: i,
              ang: (Math.PI * 2 * i) / ring.count,
              rMin: ring.rMin, rMax: ring.rMax,
              dMin: ring.dMin, dMax: ring.dMax,
              jit: 0.6 + Math.random() * 1.2
            });
          }
        }
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth, h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        if (chaosOffsets.length) {
          for (let i = 0; i < chaosOffsets.length; i++) {
            chaosOffsets[i].bx = Math.random() * w;
            chaosOffsets[i].by = Math.random() * h;
          }
        }
      }
      window.addEventListener('resize', resize);

      function processMotion(az, ts) {
        if (!isFinite(az)) return;

        // Защита от выбросов
        if (prevRaw !== null && Math.abs(az - prevRaw) > MAX_DELTA) {
          prevRaw = az;
          return;
        }
        prevRaw = az;

        // Оценка постоянной составляющей (гравитация)
        if (rawBaseline === null) rawBaseline = az;
        const dt = Math.max(1, ts - (lastCrossTime || ts));
        const alphaBase = emaAlpha(dt, 0.8);
        rawBaseline += alphaBase * (az - rawBaseline);

        // Удаляем постоянную составляющую
        const ac = az - rawBaseline;

        // Полосовая фильтрация: быстрая EMA минус медленная
        if (!signalInitialized) {
          baselineFast = ac;
          baselineSlow = ac;
          signalInitialized = true;
        }
        const aFast = emaAlpha(dt, 0.22);
        const aSlow = emaAlpha(dt, 1.8);
        baselineFast += aFast * (ac - baselineFast);
        baselineSlow += aSlow * (ac - baselineSlow);
        bandPassed = baselineFast - baselineSlow;

        // Обновление огибающих для нормализации
        const aEnv = emaAlpha(dt, ENV_TAU);
        if (bandPassed > envMax) envMax += aEnv * (bandPassed - envMax);
        else envMax += aEnv * (bandPassed - envMax) * 0.1; // медленное затухание
        if (bandPassed < envMin) envMin += aEnv * (bandPassed - envMin);
        else envMin += aEnv * (bandPassed - envMin) * 0.1;
        let range = envMax - envMin;
        if (range < 0.001) range = 0.001;

        // Нормализованный сигнал (примерно от -1 до 1)
        const norm = (bandPassed - (envMax + envMin)/2) / (range/2);
        const clampedNorm = clamp(norm, -1.5, 1.5);

        // Сохраняем в график (используем bandPassed для визуализации)
        breathGraph[graphIdx % BREATH_HISTORY] = bandPassed;
        graphIdx++;
        if (graphIdx >= BREATH_HISTORY) graphFull = true;

        // Детектор пересечений нуля вверх с гистерезисом
        const nowSign = clampedNorm > 0.1 ? 1 : (clampedNorm < -0.1 ? -1 : prevSign);
        if (nowSign === 1 && prevSign === -1) {
          // Пересечение нуля вверх
          const nowTs = ts;
          if (lastCrossTime !== 0) {
            const period = nowTs - lastCrossTime;
            if (period > MIN_PERIOD && period < MAX_PERIOD) {
              crossTimes.push(period);
              if (crossTimes.length > MAX_CROSS) crossTimes.shift();
            }
          }
          lastCrossTime = nowTs;
        }
        prevSign = nowSign;
        prevBandPassed = bandPassed;
      }

      let signalInitialized = false;
      let baselineFast = 0, baselineSlow = 0;

      function onDeviceMotion(e) {
        const a = e.accelerationIncludingGravity;
        if (!a) return;
        processMotion(a.z ?? 0, performance.now());
      }

      // --- Вычисление стабильности ---
      function computeStability() {
        if (crossTimes.length < 3) return 0;
        const mean = crossTimes.reduce((s, v) => s + v, 0) / crossTimes.length;
        const variance = crossTimes.reduce((s, v) => s + (v-mean)**2, 0) / crossTimes.length;
        const cv = Math.sqrt(variance) / mean;
        // Стабильность: 1 при cv=0, падает до 0 при cv>0.15
        return Math.max(0, 1 - cv / 0.15);
      }

      // --- Управление датчиком ---
      async function startSensors() {
        if (sensorActive) return;
        if (typeof DeviceMotionEvent === 'undefined') { alert('Датчики не поддерживаются'); return; }
        try {
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const p = await DeviceMotionEvent.requestPermission();
            if (p !== 'granted') { alert('Нет разрешения'); return; }
          }
          window.addEventListener('devicemotion', onDeviceMotion, { passive: true });
          sensorActive = true;
          startBtn.textContent = 'ПАУЗА';
        } catch (e) { alert('Ошибка датчиков'); }
      }

      function stopSensors() {
        if (!sensorActive) return;
        window.removeEventListener('devicemotion', onDeviceMotion);
        sensorActive = false;
        startBtn.textContent = 'СТАРТ';
        // Сброс всего
        rawBaseline = null;
        bandPassed = 0;
        prevBandPassed = 0;
        envMax = 0.1; envMin = -0.1;
        prevSign = 0;
        crossTimes = [];
        lastCrossTime = 0;
        signalInitialized = false;
        baselineFast = 0; baselineSlow = 0;
        prevRaw = null;
        graphIdx = 0; graphFull = false;
        breathGraph.fill(0);
        targetStability = 0;
      }

      startBtn.addEventListener('click', () => {
        if (sensorActive) stopSensors(); else startSensors();
      });

      // --- Отрисовка ---
      function draw(ts) {
        if (!lastFrameTs) lastFrameTs = ts;
        const dt = Math.min(50, ts - lastFrameTs);
        lastFrameTs = ts;
        simTime += dt;

        const w = window.innerWidth, h = window.innerHeight;
        ctx.clearRect(0, 0, w, h);

        // Обновляем стабильность
        const rawStab = computeStability();
        targetStability = rawStab;
        const alphaSmooth = 1 - Math.exp(-dt / 600);
        currentStability += (targetStability - currentStability) * alphaSmooth;
        const stabPercent = Math.round(currentStability * 100);
        stabilityText.textContent = `СТАБИЛЬНОСТЬ ${stabPercent}%`;
        stabilityFill.style.width = `${stabPercent}%`;

        // Период для анимации дыхания
        const avgPeriod = crossTimes.length ? crossTimes.reduce((a,b)=>a+b,0)/crossTimes.length : 4000;
        breathPhase += (2*Math.PI) * (dt / avgPeriod);
        breathPhase %= (2*Math.PI);
        const breath = (Math.sin(breathPhase)+1)/2;
        const eased = smoothstep(breath);

        const cx = w * 0.5, cy = h * 0.38;
        const rotFactor = currentStability;

        // Точки
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          const ring = RINGS[p.ring];
          const ch = chaosOffsets[i];

          const angle = p.ang + simTime * 0.00015 * ring.rot * rotFactor;
          const radius = p.rMin + (p.rMax - p.rMin) * eased;
          const ix = cx + Math.cos(angle) * radius;
          const iy = cy + Math.sin(angle) * radius;

          const driftX = Math.sin(simTime*0.0005 + ch.ph) * 20 * ch.dx;
          const driftY = Math.cos(simTime*0.0007 + ch.ph) * 20 * ch.dy;
          const chX = clamp(ch.bx + driftX, 0, w);
          const chY = clamp(ch.by + driftY, 0, h);

          const x = chX + (ix - chX) * currentStability;
          const y = chY + (iy - chY) * currentStability;

          const idealSize = p.dMin + (p.dMax - p.dMin) * eased;
          const size = p.jit + (idealSize - p.jit) * currentStability;
          const alpha = 0.3 + 0.7 * currentStability;
          const glow = size * 2 * currentStability;

          ctx.beginPath();
          ctx.arc(x, y, size, 0, 2*Math.PI);
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.shadowColor = `rgba(255,255,255,${alpha*0.5})`;
          ctx.shadowBlur = glow;
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // График дыхания
        const gy = h * 0.82, gh = 60;
        const gx = 20, gw = w - 40;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(gx-5, gy-gh/2-5, gw+10, gh+10);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx+gw, gy); ctx.stroke();

        const cnt = graphFull ? BREATH_HISTORY : graphIdx;
        if (cnt > 1) {
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          const start = graphFull ? graphIdx : 0;
          const step = Math.max(1, Math.floor(cnt / gw));
          for (let i = 0; i < cnt-1; i += step) {
            const i1 = (start + i) % BREATH_HISTORY;
            const i2 = (start + i + step) % BREATH_HISTORY;
            const v1 = breathGraph[i1], v2 = breathGraph[i2];
            const x1 = gx + (i/(cnt-1))*gw;
            const x2 = gx + ((i+step)/(cnt-1))*gw;
            const y1 = gy - v1 * 15;
            const y2 = gy - v2 * 15;
            if (i === 0) ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
          }
          ctx.stroke();
        }

        // Отладка
        debugEl.textContent = `Пиков: ${crossTimes.length} | Период: ${crossTimes.length ? (crossTimes.reduce((a,b)=>a+b,0)/crossTimes.length/1000).toFixed(1) : '--'}с`;

        requestAnimationFrame(draw);
      }

      function init() {
        resize();
        initPoints();
        startBtn.textContent = 'СТАРТ';
        requestAnimationFrame(draw);
      }
      init();
    })();
  </script>
</body>
</html>
