<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parasymp</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: center; background: rgba(20,20,30,0.8); padding: 12px 24px; border-radius: 40px; color: #fff; backdrop-filter: blur(8px); }
    .slider-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .slider-group label { font-size: 0.8em; opacity: 0.8; }
    .slider-group span { font-size: 0.9em; font-weight: bold; }
    input[type=range] { width: 100px; }
    select, button { padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 14px; cursor: pointer; }
    button.primary { background: rgba(100,150,255,0.3); }
    #debug { position: fixed; top: 10px; left: 10px; color: #0f0; font-family: monospace; font-size: 11px; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div class="slider-group">
    <label>Когерентность</label>
    <input type="range" id="coherenceSlider" min="0" max="1" step="0.01" value="0.5">
    <span id="coherenceValue">0.50</span>
  </div>
  <div class="slider-group">
    <label>Ритм-гид</label>
    <input type="range" id="guideRateSlider" min="3" max="18" step="0.5" value="6">
    <span id="guideRateValue">6.0</span>
  </div>
  <div class="slider-group">
    <label>Источник</label>
    <select id="axisSelect">
      <option value="orientation_beta" selected>Pitch (β)</option>
      <option value="orientation_gamma">Roll (γ)</option>
      <option value="accel_y">Accel Y</option>
    </select>
  </div>
  <button id="startBtn" class="primary">Старт</button>
</div>

<div id="debug"></div>

<script>
// ============ LOW-LATENCY BREATH EXTRACTOR ============
// Вместо bandpass: MA(5) + сверхмедленная базовая линия
// Задержка: ~30-50 мс вместо 2-3 секунд у bandpass
class LowLatencyBreathExtractor {
  constructor(fs = 60) {
    this.fs = fs;
    this.maSize = 5;
    this.alphaBase = 1.0 / (45 * fs);   // базовая линия τ=45с
    this.alphaFast = 1.0 / (0.15 * fs); // детектор пауз fast
    this.alphaSlow = 1.0 / (8 * fs);    // детектор пауз slow
    this.holdRatio = 0.25;
    
    this.maBuf = [];
    this.base = null;
    this.prevWave = null;
    this.fastEMA = null;
    this.slowEMA = null;
    this.direction = 1; // 1 или -1
  }
  
  push(value) {
    // 1) MA(5) — сглаживание, задержка 2 отсчёта
    this.maBuf.push(value);
    if (this.maBuf.length > this.maSize) this.maBuf.shift();
    const xMa = this.maBuf.reduce((a,b) => a+b, 0) / this.maBuf.length;
    
    // 2) Базовая линия (сверхмедленная EMA)
    if (this.base === null) this.base = xMa;
    this.base += this.alphaBase * (xMa - this.base);
    const wave = (xMa - this.base) * this.direction;
    
    // 3) Детектор пауз
    const d = this.prevWave === null ? 0 : wave - this.prevWave;
    this.prevWave = wave;
    const ad = Math.abs(d);
    if (this.fastEMA === null) { this.fastEMA = ad; this.slowEMA = ad; }
    this.fastEMA += this.alphaFast * (ad - this.fastEMA);
    this.slowEMA += this.alphaSlow * (ad - this.slowEMA);
    const hold = this.slowEMA > 1e-12 && this.fastEMA < this.holdRatio * this.slowEMA;
    
    return { wave, hold };
  }
  
  reset() {
    this.maBuf = [];
    this.base = null;
    this.prevWave = null;
    this.fastEMA = null;
    this.slowEMA = null;
  }
}

// ============ НОРМАЛИЗАЦИЯ ============
class AdaptiveNormalizer {
  constructor(alpha = 0.02) {
    this.alpha = alpha;
    this.min = null;
    this.max = null;
  }
  
  process(value) {
    if (this.min === null) {
      this.min = value;
      this.max = value;
      return 0.5;
    }
    
    // Обновляем минимум (только вниз)
    if (value < this.min) {
      this.min = this.min * (1 - this.alpha) + value * this.alpha;
    }
    // Обновляем максимум (только вверх)
    if (value > this.max) {
      this.max = this.max * (1 - this.alpha) + value * this.alpha;
    }
    
    // Медленная адаптация к дрейфу
    this.min += (value - this.min) * this.alpha * 0.05;
    this.max += (value - this.max) * this.alpha * 0.05;
    
    const range = this.max - this.min;
    if (range < 0.1) return 0.5;
    
    return Math.max(0, Math.min(1, (value - this.min) / range));
  }
  
  reset() { this.min = null; this.max = null; }
}

// ============ ДЕТЕКТОР ПИКОВ (правильный) ============
class PeakDetector {
  constructor(maxPeriods = 12) {
    this.maxPeriods = maxPeriods;
    this.periods = [];
    this.prevValue = null;
    this.prevDerivative = null;
    this.lastPeakTime = null;
  }
  
  push(value, now) {
    if (this.prevValue === null) {
      this.prevValue = value;
      return;
    }
    
    const derivative = value - this.prevValue;
    this.prevValue = value;
    
    if (this.prevDerivative === null) {
      this.prevDerivative = derivative;
      return;
    }
    
    // Пик: производная сменила знак с + на -
    if (this.prevDerivative > 0.001 && derivative <= 0 && this.lastPeakTime !== null) {
      const period = now - this.lastPeakTime;
      if (period > 1500 && period < 20000) { // 3-40 /мин
        this.periods.push(period);
        if (this.periods.length > this.maxPeriods) this.periods.shift();
      }
      this.lastPeakTime = now;
    } else if (this.lastPeakTime === null && this.prevDerivative > 0) {
      this.lastPeakTime = now;
    }
    
    this.prevDerivative = derivative;
  }
  
  getBPM() {
    if (this.periods.length < 2) return null;
    const avg = this.periods.reduce((a,b) => a+b, 0) / this.periods.length;
    return 60000 / avg;
  }
  
  reset() {
    this.periods = [];
    this.prevValue = null;
    this.prevDerivative = null;
    this.lastPeakTime = null;
  }
}

// ============ ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ============
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const debug = document.getElementById("debug");

let sensorActive = false;
let extractor = null;
let normalizer = null;
let peakDetector = null;

let lastSensorData = { beta: 0, gamma: 0, alpha: 0, ax: 0, ay: 0, az: 0 };
let breathPhase = 0.5;
let lastTickTime = performance.now();
let tickCount = 0;

// ============ ОБРАБОТЧИКИ СОБЫТИЙ ============
function onDeviceMotion(e) {
  const a = e.accelerationIncludingGravity || {};
  lastSensorData.ax = a.x || 0;
  lastSensorData.ay = a.y || 0;
  lastSensorData.az = a.z || 0;
}

function onDeviceOrientation(e) {
  lastSensorData.beta  = e.beta  || 0;
  lastSensorData.gamma = e.gamma || 0;
  lastSensorData.alpha = e.alpha || 0;
}

function getRawValue() {
  const axis = document.getElementById("axisSelect").value;
  switch (axis) {
    case "orientation_beta":  return lastSensorData.beta;
    case "orientation_gamma": return lastSensorData.gamma;
    case "accel_y":           return lastSensorData.ay;
    default: return 0;
  }
}

// ============ ГЛАВНЫЙ ЦИКЛ ============
function tick(now) {
  // Измеряем реальную частоту
  const dt = now - lastTickTime;
  lastTickTime = now;
  tickCount++;
  
  if (sensorActive && extractor) {
    const raw = getRawValue();
    const { wave, hold } = extractor.push(raw);
    breathPhase = normalizer.process(wave);
    peakDetector.push(breathPhase, now);
    
    // Debug info
    const bpm = peakDetector.getBPM();
    const fps = (1000 / dt).toFixed(0);
    debug.innerHTML = `
      FPS: ${fps}<br>
      Raw: ${raw.toFixed(2)}<br>
      Wave: ${wave.toFixed(3)}<br>
      Phase: ${breathPhase.toFixed(3)}<br>
      Hold: ${hold ? 'ДА' : 'нет'}<br>
      BPM: ${bpm ? bpm.toFixed(1) : '--'}
    `;
  }
  
  render(now);
  requestAnimationFrame(tick);
}

// ============ РЕНДЕР ============
function render(time) {
  const W = canvas.width = window.innerWidth;
  const H = canvas.height = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  
  const guideBPM = parseFloat(document.getElementById("guideRateSlider").value);
  const coherence = parseFloat(document.getElementById("coherenceSlider").value);
  const guidePhase = (Math.sin(time * 0.001 * Math.PI * 2 * (guideBPM / 60)) + 1) * 0.5;
  
  const cx = W / 2, cy = H / 2;
  
  // Центральный круг — ритм-гид
  const rMin = 30, rMax = 80;
  const guideR = rMin + (rMax - rMin) * guidePhase;
  ctx.beginPath();
  ctx.arc(cx, cy, guideR, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fill();
  
  // Кольцо дыхания пользователя
  const userR = rMin + (rMax - rMin) * breathPhase;
  ctx.beginPath();
  ctx.arc(cx, cy, userR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(100,200,255,${0.3 + coherence * 0.7})`;
  ctx.lineWidth = 3;
  ctx.stroke();
  
  // Точки кольца
  const nDots = 60;
  for (let i = 0; i < nDots; i++) {
    const angle = (Math.PI * 2 * i) / nDots + time * 0.0003;
    const dotR = userR + Math.sin(time * 0.002 + i) * 3 * (1 - coherence);
    const x = cx + Math.cos(angle) * dotR;
    const y = cy + Math.sin(angle) * dotR;
    ctx.beginPath();
    ctx.arc(x, y, 2 + coherence * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(150,150,150,${0.2 + coherence * 0.6})`;
    ctx.fill();
  }
}

// ============ СТАРТ/СТОП ============
document.getElementById("startBtn").addEventListener("click", async () => {
  if (sensorActive) {
    // Стоп
    window.removeEventListener('devicemotion', onDeviceMotion);
    window.removeEventListener('deviceorientation', onDeviceOrientation);
    sensorActive = false;
    document.getElementById("startBtn").textContent = "Старт";
    debug.innerHTML = "";
    return;
  }
  
  try {
    if (typeof DeviceMotionEvent?.requestPermission === 'function') {
      if (await DeviceMotionEvent.requestPermission() !== 'granted') throw new Error('no motion');
    }
    if (typeof DeviceOrientationEvent?.requestPermission === 'function') {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('no orient');
    }
    
    window.addEventListener('devicemotion', onDeviceMotion);
    window.addEventListener('deviceorientation', onDeviceOrientation);
    
    // Измеряем реальную частоту rAF
    const t1 = performance.now();
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const t2 = performance.now();
    const realFs = 1000 / (t2 - t1); // ~60 Гц
    
    extractor = new LowLatencyBreathExtractor(realFs);
    normalizer = new AdaptiveNormalizer(0.02);
    peakDetector = new PeakDetector();
    
    sensorActive = true;
    document.getElementById("startBtn").textContent = "Стоп";
  } catch (err) {
    alert('Сенсоры недоступны: ' + err.message);
  }
});

// UI
document.getElementById("coherenceSlider").addEventListener("input", e => {
  document.getElementById("coherenceValue").textContent = parseFloat(e.target.value).toFixed(2);
});
document.getElementById("guideRateSlider").addEventListener("input", e => {
  document.getElementById("guideRateValue").textContent = parseFloat(e.target.value).toFixed(1);
});

requestAnimationFrame(tick);
</script>
</body>
</html>
