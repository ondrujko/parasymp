<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>IMU Signal Monitor — 10s Window (fixed)</title>

<style>
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --border:#30363d;
  --text:#e6edf3;
  --text-secondary:#8b949e;
  --accent:#58a6ff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:system-ui, monospace;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:12px;
}

.app{
  width:100%;
  max-width:900px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

button{
  padding:8px 14px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
}

button.primary{
  background:var(--accent);
  color:#000;
}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  margin-top:10px;
  padding:10px;
  border-radius:10px;
}

canvas{
  width:100%;
  height:220px;
}
</style>
</head>

<body>
<div class="app">

  <div class="header">
    <div>IMU Monitor (fixed time sync)</div>
    <div>
      <button id="start">Start</button>
      <button id="demo">Demo</button>
    </div>
  </div>

  <div class="panel">
    <canvas id="accel"></canvas>
  </div>

  <div class="panel">
    <canvas id="gyro"></canvas>
  </div>

</div>

<script>
(() => {

const WINDOW = 10000;

const accel = [];
const gyro = [];

let running = false;
let demo = false;

let demoStart = 0;

const cAccel = document.getElementById("accel");
const cGyro = document.getElementById("gyro");

const ctxA = cAccel.getContext("2d");
const ctxG = cGyro.getContext("2d");

function now(){
  return performance.now();
}

/* ---------- DATA ---------- */

function pushAccel(t,x,y,z){
  accel.push({t,x,y,z});
  trim(accel,t);
}

function pushGyro(t,x,y,z){
  gyro.push({t,x,y,z});
  trim(gyro,t);
}

function trim(arr,t){
  const cut = t - WINDOW;
  while(arr.length && arr[0].t < cut){
    arr.shift();
  }
}

/* ---------- SENSOR ---------- */

function onMotion(e){
  if(!running) return;

  const t = now();

  const a = e.accelerationIncludingGravity;
  const r = e.rotationRate;

  if(a){
    pushAccel(t, a.x||0, a.y||0, a.z||0);
  }

  if(r){
    pushGyro(t, r.beta||0, r.gamma||0, r.alpha||0);
  }
}

/* ---------- DEMO ---------- */

function demoTick(){
  const t = now();
  const e = (t - demoStart)/1000;

  pushAccel(
    t,
    Math.sin(e)*2,
    Math.cos(e*0.7)*2,
    9.8 + Math.sin(e*0.3)*1.5
  );

  pushGyro(
    t,
    Math.sin(e*1.3)*40,
    Math.cos(e*1.1)*40,
    Math.sin(e*0.9)*30
  );
}

/* ---------- DRAW ---------- */

function draw(ctx, data, color){
  const w = cAccel.width;
  const h = cAccel.height;

  ctx.clearRect(0,0,w,h);

  if(data.length < 2) return;

  const t = now();
  const minT = t - WINDOW;

  let min = Infinity;
  let max = -Infinity;

  for(const p of data){
    min = Math.min(min,p.x,p.y,p.z);
    max = Math.max(max,p.x,p.y,p.z);
  }

  const pad = (max-min)*0.2 || 1;
  min -= pad;
  max += pad;

  const sx = w / WINDOW;
  const sy = h / (max-min);

  function plot(key, stroke){
    ctx.beginPath();
    ctx.strokeStyle = stroke;

    let started = false;

    for(const p of data){
      if(p.t < minT) continue;

      const x = (p.t - minT) * sx;
      const y = h - (p[key] - min) * sy;

      if(!started){
        ctx.moveTo(x,y);
        started = true;
      } else {
        ctx.lineTo(x,y);
      }
    }

    ctx.stroke();
  }

  plot("x","red");
  plot("y","green");
  plot("z","cyan");
}

/* ---------- LOOP ---------- */

function loop(){
  const t = now();

  if(demo){
    demoTick();
  }

  draw(ctxA, accel);
  draw(ctxG, gyro);

  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */

document.getElementById("start").onclick = async () => {
  running = !running;

  if(running){
    accel.length = 0;
    gyro.length = 0;

    try{
      if(DeviceMotionEvent?.requestPermission){
        await DeviceMotionEvent.requestPermission();
      }
    }catch(e){}

    window.addEventListener("devicemotion", onMotion);
  } else {
    window.removeEventListener("devicemotion", onMotion);
  }
};

document.getElementById("demo").onclick = () => {
  demo = !demo;
  demoStart = now();

  accel.length = 0;
  gyro.length = 0;
};

loop();

})();
</script>
</body>
</html>
