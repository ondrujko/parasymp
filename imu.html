<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>IMU Signal Monitor</title>

<style>
:root{
  --bg:#0d1117;
  --surface:#161b22;
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;

  --x:#ff4d4d;
  --y:#4dff88;
  --z:#4da3ff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, monospace;
  display:flex;
  justify-content:center;
  padding:12px;
}

.app{width:100%;max-width:900px}

.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

button{
  padding:8px 14px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  margin-left:6px;
}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}

.legend{
  display:flex;
  gap:14px;
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}

.item{display:flex;align-items:center;gap:6px}

.dot{width:10px;height:10px;border-radius:50%}

.x{background:var(--x)}
.y{background:var(--y)}
.z{background:var(--z)}

canvas{
  width:100%;
  height:220px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>IMU Monitor</div>
    <div>
      <button id="start">Start</button>
      <button id="demo">Demo</button>
    </div>
  </div>

  <div class="panel">
    <div class="legend">
      <div class="item"><span class="dot x"></span>X</div>
      <div class="item"><span class="dot y"></span>Y</div>
      <div class="item"><span class="dot z"></span>Z</div>
    </div>
    <canvas id="accel"></canvas>
  </div>

  <div class="panel">
    <div class="legend">
      <div class="item"><span class="dot x"></span>X</div>
      <div class="item"><span class="dot y"></span>Y</div>
      <div class="item"><span class="dot z"></span>Z</div>
    </div>
    <canvas id="gyro"></canvas>
  </div>

  <div class="panel">
    <div class="legend">
      <div class="item"><span class="dot x"></span>Magnitude</div>
    </div>
    <canvas id="acc_mag"></canvas>
  </div>

</div>

<script>
(() => {

const WINDOW = 10000;

const accel = [];
const gyro = [];
const accMag = [];

let running = false;
let demo = false;
let demoStart = 0;

const cA = document.getElementById("accel");
const cG = document.getElementById("gyro");
const cM = document.getElementById("acc_mag");

const ctxA = cA.getContext("2d");
const ctxG = cG.getContext("2d");
const ctxM = cM.getContext("2d");

function now(){ return performance.now(); }

function pushVec(arr,t,x,y,z){
  arr.push({t,x,y,z});
  const cut = t - WINDOW;
  while(arr.length && arr[0].t < cut) arr.shift();
}

function pushScalar(arr,t,v){
  arr.push({t,v});
  const cut = t - WINDOW;
  while(arr.length && arr[0].t < cut) arr.shift();
}

/* ---------- SENSOR ---------- */

function onMotion(e){
  if(!running) return;

  const t = now();
  const acc = e.accelerationIncludingGravity;
  const rot = e.rotationRate;

  if(acc){
    pushVec(accel,t,acc.x||0,acc.y||0,acc.z||0);

    const mag =
      Math.sqrt((acc.x||0)**2 + (acc.y||0)**2 + (acc.z||0)**2);

    pushScalar(accMag,t,mag);
  }

  if(rot){
    pushVec(gyro,t,rot.beta||0,rot.gamma||0,rot.alpha||0);
  }
}

/* ---------- DEMO ---------- */

function demoTick(){
  const t = now();
  const e = (t-demoStart)/1000;

  pushVec(accel,t,
    Math.sin(e)*2,
    Math.cos(e*0.7)*2,
    9.8 + Math.sin(e*0.3)*1.2
  );

  pushVec(gyro,t,
    Math.sin(e*1.3)*40,
    Math.cos(e*1.1)*40,
    Math.sin(e*0.9)*30
  );

  const mag =
    Math.sqrt(
      Math.sin(e)**2 +
      Math.cos(e*0.7)**2 +
      (9.8 + Math.sin(e*0.3))**2
    );

  pushScalar(accMag,t,mag);
}

/* ---------- DRAW VECTOR ---------- */

function drawVec(ctx, canvas, data){
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = 220;

  ctx.clearRect(0,0,w,h);

  if(data.length < 2) return;

  const t = now();
  const minT = t - WINDOW;

  let min = Infinity, max = -Infinity;

  for(const p of data){
    min = Math.min(min,p.x,p.y,p.z);
    max = Math.max(max,p.x,p.y,p.z);
  }

  const pad = (max-min)*0.2 || 1;
  min -= pad; max += pad;

  const sx = w / WINDOW;
  const sy = h / (max-min || 1);

  const colors = {
    x:"#ff4d4d",
    y:"#4dff88",
    z:"#4da3ff"
  };

  function plot(key,color){
    ctx.beginPath();
    ctx.strokeStyle = color;

    let started = false;

    for(const p of data){
      if(p.t < minT) continue;

      const x = (p.t - minT) * sx;
      const y = h - (p[key] - min) * sy;

      if(!started){
        ctx.moveTo(x,y);
        started = true;
      } else ctx.lineTo(x,y);
    }

    ctx.stroke();
  }

  plot("x",colors.x);
  plot("y",colors.y);
  plot("z",colors.z);
}

/* ---------- DRAW SCALAR ---------- */

function drawScalar(ctx, canvas, data){
  const w = canvas.width = canvas.clientWidth;
  const h = canvas.height = 220;

  ctx.clearRect(0,0,w,h);

  if(data.length < 2) return;

  const t = now();
  const minT = t - WINDOW;

  let min = Infinity, max = -Infinity;

  for(const p of data){
    min = Math.min(min,p.v);
    max = Math.max(max,p.v);
  }

  const pad = (max-min)*0.2 || 1;
  min -= pad; max += pad;

  const sx = w / WINDOW;
  const sy = h / (max-min || 1);

  ctx.beginPath();
  ctx.strokeStyle = "#ffffff";

  let started = false;

  for(const p of data){
    if(p.t < minT) continue;

    const x = (p.t - minT) * sx;
    const y = h - (p.v - min) * sy;

    if(!started){
      ctx.moveTo(x,y);
      started = true;
    } else ctx.lineTo(x,y);
  }

  ctx.stroke();
}

/* ---------- LOOP ---------- */

function loop(){
  if(demo) demoTick();

  drawVec(ctxA,cA,accel);
  drawVec(ctxG,cG,gyro);
  drawScalar(ctxM,cM,accMag);

  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */

document.getElementById("start").onclick = async () => {
  running = !running;

  if(running){
    accel.length = 0;
    gyro.length = 0;
    accMag.length = 0;

    try{
      if(DeviceMotionEvent?.requestPermission){
        await DeviceMotionEvent.requestPermission();
      }
    }catch(e){}

    window.addEventListener("devicemotion", onMotion);
  } else {
    window.removeEventListener("devicemotion", onMotion);
  }
};

document.getElementById("demo").onclick = () => {
  demo = !demo;
  demoStart = now();

  accel.length = 0;
  gyro.length = 0;
  accMag.length = 0;
};

loop();

})();
</script>

</body>
</html>
